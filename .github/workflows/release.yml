# Cuts a release from the current main commit after it has fully qualified.
#
# Run it only once the version-bump commit from `pnpm release:prepare` is on main and push CI,
# Test All Browsers, and the Full browser-engine suite have all passed on that exact commit:
#
#   gh workflow run release.yml --ref main
#
# It plans the unreleased `<package>@<version>` tags from the committed package.json versions,
# re-verifies the three qualification gates for the exact commit, packs each tarball with the
# pinned Node and pnpm, pushes the annotated tags atomically, creates each GitHub Release with its
# assets, and then dispatches publish.yml on each tag. A release created with GITHUB_TOKEN does not
# emit `release: published` to other workflows, so that explicit dispatch is the only publish
# trigger; publish.yml's own byte-verification and npm-publish environment approval still apply.
name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release; "all" releases every package whose version is not tagged yet'
        required: false
        default: all
        type: choice
        options:
          - all
          - lyra-ui
          - lyra-flags

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - name: Require main
        id: source
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Dispatch the Release workflow on main (gh workflow run release.yml --ref main), not $GITHUB_REF."
            exit 1
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Plan unreleased package tags
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          node scripts/release-integrity.mjs plan-release \
            --package "$PACKAGE" \
            --github-output "$GITHUB_OUTPUT"

      # The same exact-commit checks publish.yml repeats before npm publish. They are expected to
      # be green already, so a short window only absorbs a run that is just finishing.
      - name: Require CI, Test All Browsers, and the Full browser-engine suite on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release-integrity.mjs wait-ci \
            --repository "$GITHUB_REPOSITORY" --sha "$SHA" --workflow ci.yml \
            --timeout-seconds 300 --poll-seconds 20
          node scripts/release-integrity.mjs wait-test-all-browsers \
            --repository "$GITHUB_REPOSITORY" --sha "$SHA" --workflow test-all-browsers.yml \
            --timeout-seconds 300 --poll-seconds 20
          node scripts/release-integrity.mjs wait-full-engine \
            --repository "$GITHUB_REPOSITORY" --sha "$SHA" --workflow full-engine.yml \
            --timeout-seconds 300 --poll-seconds 20

  pack:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # Same shallow, credential-free checkout release-verification.yml rebuilds from.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install exact dependencies
        run: |
          node scripts/check-node-version.mjs
          pnpm install --frozen-lockfile

      # The same pack command release-verification.yml rebuilds from the tag and byte-compares.
      - name: Pack and collect release assets
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          for tag in $TAGS; do
            dir="packages/${tag%@*}"
            name="$(node -p "require('./$dir/package.json').name")"
            dest="$assets/${tag%@*}"
            mkdir -p "$dest"
            pnpm --filter "$name" --fail-if-no-match pack --pack-destination "$dest"
            pnpm --filter "$name" --if-present run check:component-quality:built
            tarballs=("$dest"/*.tgz)
            if [[ "${#tarballs[@]}" -ne 1 || ! -f "${tarballs[0]}" ]]; then
              echo "::error::Expected exactly one tarball for $tag."
              exit 1
            fi
            node scripts/release-integrity.mjs validate-tarball --tag "$tag" --file "${tarballs[0]}"
            files=("$dir/CHANGELOG.md")
            if [[ "$(node -p "!!(require('./$dir/package.json').scripts || {}).manifest")" == "true" ]]; then
              files+=("$dir/custom-elements.json" "$dir/llms.txt" "$dir/llms-full.txt")
            fi
            for file in "${files[@]}"; do
              if [[ ! -f "$file" ]]; then
                echo "::error::Release asset missing: $file"
                exit 1
              fi
              cp "$file" "$dest/"
            done
          done
          # The pack lifecycle regenerates version-derived files. Any tracked drift means the
          # release commit did not contain the output `pnpm release:prepare` should have produced.
          if ! git diff --exit-code --stat; then
            echo "::error::Packing changed tracked files; rerun the generators, commit, and requalify."
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [plan, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # No checkout: an empty repository fetches only the qualified commit, so no repository
      # script runs while the write token is present.
      - name: Push annotated release tags atomically
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/tag-repo"
          git init --quiet "$repo"
          cd "$repo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --depth=1 origin "$SHA"
          tags=()
          for tag in $TAGS; do
            git tag -a "$tag" -m "Release $tag" "$SHA"
            tags+=("$tag")
          done
          # A multi-package release is one unit; an existing tag rejects the whole push.
          git push --atomic origin "${tags[@]/#/refs/tags/}"

      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            dest="$RUNNER_TEMP/release-assets/${tag%@*}"
            gh release create "$tag" "$dest"/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "@aceshooting/$tag" \
              --generate-notes
          done

      - name: Dispatch npm publish for each tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f tag="$tag"
            {
              echo "- \`$tag\`: tagged, released, publish.yml dispatched."
            } >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "Approve the \`npm-publish\` environment on each Publish run to publish to npm."
          } >> "$GITHUB_STEP_SUMMARY"
