name: Prepare source artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Prepare source projections or consume pending changesets for a release review'
        required: true
        type: choice
        default: source
        options:
          - source
          - release
      publication:
        description: 'Optional immutable capture JSON: version, tagObject, commit, tarballSha256, registryIntegrity'
        required: false
        type: string
        default: ''
      sourceContracts:
        description: 'Optional reviewed JSON: schemaVersion, explicit fingerprint updates and authored locator enrollments'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: prepare-source-artifacts
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREPARATION_MODE: ${{ inputs.mode }}
      SOURCE_CONTRACTS_JSON: ${{ inputs.sourceContracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check generation toolchain
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const node = readFileSync('.nvmrc', 'utf8').trim().replace(/^v/, '');
          const manager = JSON.parse(readFileSync('package.json', 'utf8')).packageManager;
          const pnpm = /^pnpm@(\d+\.\d+\.\d+)$/.exec(manager)?.[1];
          const actualPnpm = execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim();
          if (process.versions.node !== node || !pnpm || actualPnpm !== pnpm) {
            throw new Error(`Expected Node ${node} and ${manager}; got Node ${process.versions.node} and pnpm@${actualPnpm}`);
          }
          NODE
      - name: Validate preparation inputs and source path safety
        env:
          PUBLICATION_JSON: ${{ inputs.publication }}
        run: |
          node --input-type=module <<'NODE'
          import { assertPreparationInputs } from './scripts/prepare-artifacts-paths.mjs';
          assertPreparationInputs(process.env.PREPARATION_MODE, process.env.PUBLICATION_JSON, process.env.SOURCE_CONTRACTS_JSON);
          NODE
          node --test scripts/prepare-artifacts.test.mjs
      - run: pnpm install --frozen-lockfile
      - name: Check scoped source-contract preparation
        run: node --test scripts/prepare-source-contracts.test.mjs
      - name: Capture an explicitly pinned publication
        if: inputs.mode == 'source'
        env:
          PUBLICATION_JSON: ${{ inputs.publication }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-artifacts.mjs capture
      # History reconciliation needs a current manifest and pinned inventory first.
      # The repository runner refreshes package, plugin, size and Storybook projections.
      - name: Reconcile release history and generate source
        if: inputs.mode == 'source'
        run: |
          pnpm --filter @aceshooting/lyra-ui run default-string-slices
          pnpm --filter @aceshooting/lyra-ui run translation-slices
          pnpm manifest
          pnpm --filter @aceshooting/lyra-ui run component-inventory
          pnpm --filter @aceshooting/lyra-ui run component-metadata:history
          ./scripts/regen.sh
      - name: Apply explicitly reviewed source-contract enrollment
        if: inputs.mode == 'source'
        run: node scripts/prepare-artifacts.mjs source-contracts
      - name: Prepare release source from pending changesets
        if: inputs.mode == 'release'
        run: pnpm release:prepare
      - name: Verify generated source contracts
        run: |
          pnpm --filter @aceshooting/lyra-ui run check:published-compatibility
          pnpm --filter @aceshooting/lyra-ui run check:component-metadata
          pnpm --filter @aceshooting/lyra-ui run check:component-quality:built
          pnpm check:secrets
          git diff --check
      - name: Package source delta for review
        run: node scripts/prepare-artifacts.mjs bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-source-${{ github.sha }}
          path: ${{ runner.temp }}/lyra-generated-source
          if-no-files-found: error
          retention-days: 14
