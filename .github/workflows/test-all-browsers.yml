name: Test All Browsers

# Firefox and WebKit complete suites are release-required in full-engine.yml, so the default omits them.
on:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Comma-separated browser names (default: chromium,chrome,edge; also firefox, safari)"
        required: false
        default: chromium,chrome,edge
        type: string

permissions:
  contents: read

jobs:
  # Turns the comma-separated `browsers` input into a JSON array so the `test` job's matrix can
  # consume it via fromJSON() -- workflow_dispatch inputs are always plain strings, matrices need
  # a real array.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browsers: ${{ steps.split.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: split
        env:
          BROWSERS_INPUT: ${{ inputs.browsers }}
        run: node scripts/plan-test-browsers.mjs >> "$GITHUB_OUTPUT"

  # One lyra-ui build for every browser shard below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aceshooting/lyra-ui build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyra-ui-dist
          path: packages/lyra-ui/dist
          retention-days: 1

  # Preserve each shard's exact process/concurrency shape while running the existing four shards
  # on independent runners. This changes scheduling only: the same deterministic shard commands
  # run for every requested browser, without raising per-process browser concurrency.
  test:
    needs: [plan, build]
    name: ${{ matrix.browser }} / shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Native engines inherit their pinned binaries and OS dependencies. Real Chrome/Edge channels
    # retain hosted VMs. An empty image means no job container; the matrix axes stay unchanged.
    container:
      image: ${{ contains(fromJSON('["chromium","firefox","safari"]'), matrix.browser) && 'mcr.microsoft.com/playwright:v1.64.0-noble' || '' }}
      options: --shm-size=2g -v /usr/share/fonts:/usr/share/host-fonts:ro
    env:
      HOME: ${{ contains(fromJSON('["chromium","firefox","safari"]'), matrix.browser) && '/root' || '/home/runner' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
        shard: [1, 2, 3, 4]
    steps:
      - name: Match the runner's default font resolution
        if: matrix.browser != 'chrome' && matrix.browser != 'edge'
        run: |
          cat > /etc/fonts/local.conf <<'CONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig><dir>/usr/share/host-fonts</dir></fontconfig>
          CONF
          fc-cache -f >/dev/null 2>&1 || true
          resolved="$(fc-match sans-serif)"
          echo "sans-serif -> $resolved"
          case "$resolved" in
            *DejaVu*) ;;
            *) echo "::error::sans-serif resolved to '$resolved', not DejaVu -- text-metric tests would measure the wrong typeface"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: ./scripts/ci-phase.sh dependencies pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lyra-ui-dist
          path: packages/lyra-ui/dist
      # As in ci.yml's chrome/edge legs, a cache hit reuses the hosted image's channel install.
      - name: Restore Playwright channel cache
        if: matrix.browser == 'chrome' || matrix.browser == 'edge'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser == 'edge' && 'msedge' || 'chrome' }}-${{ runner.os }}-${{ hashFiles('.github/playwright-version.txt') }}
          restore-keys: playwright-${{ matrix.browser == 'edge' && 'msedge' || 'chrome' }}-${{ runner.os }}-
      - name: Install channel OS dependencies
        if: matrix.browser == 'chrome' || matrix.browser == 'edge'
        env:
          INSTALL_BROWSER: ${{ matrix.browser == 'edge' && 'msedge' || 'chrome' }}
        run: ./scripts/ci-phase.sh channel-os pnpm --filter @aceshooting/lyra-ui exec playwright install-deps "$INSTALL_BROWSER"
      - name: Install real browser channel
        if: (matrix.browser == 'chrome' || matrix.browser == 'edge') && steps.playwright-cache.outputs.cache-hit != 'true'
        env:
          INSTALL_BROWSER: ${{ matrix.browser == 'edge' && 'msedge' || 'chrome' }}
        run: ./scripts/ci-phase.sh channel-binary pnpm --filter @aceshooting/lyra-ui exec playwright install "$INSTALL_BROWSER"
      # One browser per job: --serial streams the existing lane and keeps its tuned concurrency,
      # deterministic port and complete four-way partition, against the build job's dist/.
      - name: Run complete browser shard
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_ALL_BROWSERS_SKIP_INSTALL: '1'
          TEST_ALL_BROWSERS_SKIP_BUILD: '1'
        run: ./scripts/ci-phase.sh browser-sweep ./scripts/test_all_browsers.sh --serial --browsers "$TEST_BROWSER" --shards "$TEST_SHARD"

  # Preserve one stable browser-named release check per requested browser while the work fans out.
  # A matrix-wide failure makes every aggregate fail; the individual worker still names the exact
  # browser and shard to reproduce.
  # release-qualification: matrix
  qualification:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - name: Require every browser shard
        env:
          TEST_MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$TEST_MATRIX_RESULT" = success
