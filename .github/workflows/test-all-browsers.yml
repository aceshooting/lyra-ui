name: Test All Browsers

on:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Comma-separated browser names (default: chromium,firefox,chrome,edge,safari)"
        required: false
        default: chromium,firefox,chrome,edge,safari
        type: string

permissions:
  contents: read

jobs:
  # Turns the comma-separated `browsers` input into a JSON array so the `test` job's matrix can
  # consume it via fromJSON() -- workflow_dispatch inputs are always plain strings, matrices need
  # a real array.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browsers: ${{ steps.split.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: split
        env:
          BROWSERS_INPUT: ${{ inputs.browsers }}
        run: node scripts/plan-test-browsers.mjs >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One browser per matrix job -- each gets its own isolated runner VM, unlike the previous
      # single-runner design where all 5 browsers' dev servers and browser processes competed for
      # the same ports and CPU/RAM, causing EADDRINUSE collisions and spurious 30-120s timeouts.
      # Reuses test_all_browsers.sh's existing per-browser install-name mapping (edge -> msedge,
      # safari -> webkit) and build/run logic rather than duplicating it inline.
      - name: Run browser test sweep
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: ./scripts/test_all_browsers.sh --browsers "$TEST_BROWSER"
