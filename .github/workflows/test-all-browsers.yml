name: test-all-browsers

on:
  workflow_dispatch:
    inputs:
      browsers:
        description: Comma-separated browser names (default: chromium,firefox,chrome,edge,safari)
        required: false
        default: chromium,firefox,chrome,edge,safari
        type: string
      serial:
        description: Run browser lanes one-by-one inside the script
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all-browser test sweep
        run: |
          if [[ "${{ inputs.serial }}" == "true" ]]; then
            ./scripts/test_all_browsers.sh --serial --browsers "${{ inputs.browsers }}"
          else
            ./scripts/test_all_browsers.sh --browsers "${{ inputs.browsers }}"
          fi
