name: test-all-browsers

on:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Comma-separated browser names (default: chromium,firefox,chrome,edge,safari)"
        required: false
        default: chromium,firefox,chrome,edge,safari
        type: string
      # Defaults to true: this job runs on ONE ubuntu-latest runner (no matrix, unlike
      # full-engine.yml's per-browser/per-shard jobs), and all 5 browsers' full test suites
      # running their own dev servers concurrently on a single small VM collide on ports
      # (EADDRINUSE) and starve each other into spurious 30-120s timeouts. Serial keeps each
      # lane's dev server and browser process alone on the runner; only override to false if
      # invoking with a runner known to have the headroom for true parallelism.
      serial:
        description: Run browser lanes one-by-one inside the script
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all-browser test sweep
        run: |
          if [[ "${{ inputs.serial }}" == "true" ]]; then
            ./scripts/test_all_browsers.sh --serial --browsers "${{ inputs.browsers }}"
          else
            ./scripts/test_all_browsers.sh --browsers "${{ inputs.browsers }}"
          fi
