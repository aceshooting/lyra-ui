name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR supersedes the previous run's results entirely -- cancel it
# instead of burning runner-minutes (and Codecov/Scorecard-style upload slots) on output nobody
# will read. `github.ref` alone would let concurrent PRs targeting different branches collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job pushes, comments, or otherwise writes to the repo -- checkout and
# artifact upload/download both work fine under read-only contents access.
permissions:
  contents: read

# Shared bootstrap steps, repeated per job (rather than built + uploaded once as an artifact)
# because `pnpm install`/`pnpm build` are only a few seconds each here -- far cheaper than the
# artifact upload/download round trip would cost, and it keeps every job independently
# reproducible from a clean checkout.
jobs:
  # release-qualification: required
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # contract-policy's component-metadata gate reproduces immutable release-tag evidence and
      # intentionally fails closed in shallow clones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Static/config consistency checks: none of these need a library build, a docs build, or a
  # browser. They read already-committed files (custom-elements.json, llms/, plugin manifests,
  # README), except for the content-addressed read-only npm fetch that proves the pinned upstream
  # public manifests, and either validate or regenerate-and-diff them.
  # release-qualification: required
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workflows
      - run: pnpm check:release-qualification
      - run: node scripts/release-integrity.test.mjs
      - run: pnpm --filter @aceshooting/lyra-ui test:public-api
      - run: pnpm --filter @aceshooting/lyra-ui test:pinned-upstream-manifests
      # Fetches exact public npm tarballs with lifecycle scripts impossible, validates their
      # identities plus SHA-512/SHA-256 pins, and feeds only custom-elements.json into the strict
      # inventory comparator. Clone-built analyzer variants are not canonical evidence.
      - run: pnpm --filter @aceshooting/lyra-ui check:pinned-upstream-manifests
      # lyra-ui's own Chromium suite runs in the build-and-coverage job via test:coverage --
      # this only needs to cover the other workspace package(s), e.g. lyra-flags's own test script.
      - run: pnpm --filter '!@aceshooting/lyra-ui' -r test
      # knip.jsonc's `entry` patterns model the wildcard `./components/*`/`./internal/*` package
      # exports, so a failure here is a genuinely orphaned file/script or an unused/unlisted
      # dependency -- not the whole library being flagged dead. See knip.jsonc's own header comment.
      - run: pnpm run check:dead-code
      - run: pnpm run check:secrets
      # Root component imports, the runtime registration allowlist, and sideEffects are generated
      # from the checked-in component inventory. Regenerate-and-diff catches a new/moved component
      # even when a contributor ran only the non-mutating lint check locally.
      - run: pnpm registrations
      - run: git diff --exit-code -- packages/lyra-ui/src/all.ts packages/lyra-ui/src/ssr/all.ts packages/lyra-ui/src/components/lr-*.ts packages/lyra-ui/src/internal/root-registration-allowlist.ts packages/lyra-ui/package.json
      - run: pnpm manifest
      - run: git diff --exit-code -- packages/lyra-ui/custom-elements.json
      - run: pnpm --filter @aceshooting/lyra-ui run generate-editor-data
      - run: git diff --exit-code -- packages/lyra-ui/vscode-html-data.json packages/lyra-ui/vscode-css-data.json packages/lyra-ui/web-types.json
      - run: pnpm readme:check
      - run: ./package.sh
      - run: git diff --exit-code -- plugins/lyra-ui/skills/lyra-ui/references/ skills/lyra-ui.skill skills/compose-lyra-interfaces.skill
      - run: pnpm skill:check
      - run: pnpm storybook:check-theme

  # Lyra's own Chromium suite and associated dist checks are now split into independent,
  # dependency-aware jobs to saturate GitHub-hosted runner parallelism:
  # - build publishes dist once for all other phases
  # - component-quality, ssr, hydration, and coverage all consume that dist independently
  # - a final aggregator reports a single `build-and-coverage` check status
  #   for branch protection while preserving all current coverage gating behavior.
  build_and_coverage_build:
    name: build-and-coverage / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # src/package-entrypoints.test.ts dynamically imports the package's published entry points
      # (./dist/lyra.js etc., per package.json's "exports"), which only exist after a build.
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyra-ui-dist
          path: packages/lyra-ui/dist
          retention-days: 1

  build_and_coverage_quality:
    name: build-and-coverage / quality
    runs-on: ubuntu-latest
    needs: build_and_coverage_build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lyra-ui-dist
          path: packages/lyra-ui/dist
      # Recompute the inventory's per-component standalone gzip evidence from this exact build.
      - run: pnpm --filter @aceshooting/lyra-ui check:component-quality:built
      # Needs dist/ from the build job above: measures the library's own esbuild-bundled gzip
      # weight (optional peers externalized) against the budgets in
      # packages/lyra-ui/scripts/bundle-budgets.json, and re-measures every per-component entry so
      # the sizes the README badges publish from packages/lyra-ui/scripts/bundle-stats.json cannot
      # silently go stale.
      - run: pnpm --filter @aceshooting/lyra-ui check:bundle-size
      # Reports the same esbuild-bundled entry points (whichever set bundle-budgets.json currently
      # lists) to Codecov as the `lyra-ui-dist` bundle, for per-PR size deltas -- same esbuild
      # invocation, same externals. The blocking weight gate is check:bundle-size above;
      # this step is non-fatal and no-ops entirely without CODECOV_TOKEN.
      - name: Upload library bundle analysis to Codecov
        run: pnpm --filter @aceshooting/lyra-ui codecov:bundle
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build_and_coverage_ssr:
    name: build-and-coverage / ssr
    runs-on: ubuntu-latest
    needs: build_and_coverage_build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # install-deps (apt) isn't covered by the cache above -- every job runs on a fresh VM --
      # so it always runs; only the ~100MB+ browser binary download is skippable on a cache hit.
      - run: pnpm --filter @aceshooting/lyra-ui exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lyra-ui-dist
          path: packages/lyra-ui/dist
      # Proves root + every granular import under plain Node, renders the complete declared SSR
      # matrix, then loads a real DSD response in Chromium and rejects hydration warnings,
      # replaced server nodes, or broken client-render fallbacks.
      - run: pnpm --filter @aceshooting/lyra-ui test:ssr

  build_and_coverage_hydration:
    name: build-and-coverage / hydration
    runs-on: ubuntu-latest
    needs: build_and_coverage_build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # install-deps (apt) isn't covered by the cache above -- every job runs on a fresh VM --
      # so it always runs; only the ~100MB+ browser binary download is skippable on a cache hit.
      - run: pnpm --filter @aceshooting/lyra-ui exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lyra-ui-dist
          path: packages/lyra-ui/dist
      # Proves hydration behavior with the same built artifacts and strict Node/browser
      # matrix assumptions as `test:ssr`.
      - run: pnpm --filter @aceshooting/lyra-ui test:hydration

  build_and_coverage_coverage:
    name: build-and-coverage / coverage
    runs-on: ubuntu-latest
    needs: build_and_coverage_build
    # This lane includes fresh-VM apt setup before the deterministic one-file-at-a-time sweep.
    # A degraded mirror made install-deps take 10.5+ minutes, then the former 20-minute ceiling
    # cancelled an otherwise clean run at 284/456 files. Thirty minutes preserves hang detection
    # while budgeting the observed end-to-end path rather than only the test command itself.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # install-deps (apt) isn't covered by the cache above -- every job runs on a fresh VM --
      # so it always runs; only the ~100MB+ browser binary download is skippable on a cache hit.
      - run: pnpm --filter @aceshooting/lyra-ui exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lyra-ui-dist
          path: packages/lyra-ui/dist
      # Keep coverage + floor + report uploads in one runner to preserve current gate semantics.
      # Coverage uses a complete browser sweep over the same file list as today.
      - run: pnpm --filter @aceshooting/lyra-ui test:coverage
      # The per-metric floors in packages/lyra-ui/scripts/coverage-floors.json are what
      # web-test-runner.config.js enforces on the run above. They only gate anything while they
      # sit just under the measurement, so this reads the report the previous step just wrote and
      # fails when a floor drifted far below it (a floor 5+ points low has stopped being a gate)
      # or above it. Refresh with `--write-floors`; lowering one needs `--allow-lower` and shows up
      # in the diff. Deliberately its own step so the failure names itself instead of surfacing as
      # a mystery inside the long coverage step.
      - run: pnpm --filter @aceshooting/lyra-ui check:coverage-floors
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/lyra-ui/coverage/lcov.info
          # codecov.yml declares a `lyra-ui` flag (scoped to packages/lyra-ui/src/**) and
          # comment.layout renders a `flags` section. A flag only ever receives data from
          # uploads tagged with it, so without this the flag stays permanently empty and
          # that section of the PR comment renders blank.
          flags: lyra-ui
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          file: packages/lyra-ui/coverage/junit.xml
          flags: lyra-ui
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # release-qualification: required
  build-and-coverage:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build_and_coverage_build
      - build_and_coverage_quality
      - build_and_coverage_ssr
      - build_and_coverage_hydration
      - build_and_coverage_coverage
    steps:
      - name: Aggregate build-and-coverage lanes
        run: |
          set -euo pipefail
          failed=0
          if [[ "${{ needs.build_and_coverage_build.result }}" != "success" ]]; then
            echo "::error::build_and_coverage_build failed with status: ${{ needs.build_and_coverage_build.result }}"
            failed=1
          fi
          if [[ "${{ needs.build_and_coverage_quality.result }}" != "success" ]]; then
            echo "::error::build_and_coverage_quality failed with status: ${{ needs.build_and_coverage_quality.result }}"
            failed=1
          fi
          if [[ "${{ needs.build_and_coverage_ssr.result }}" != "success" ]]; then
            echo "::error::build_and_coverage_ssr failed with status: ${{ needs.build_and_coverage_ssr.result }}"
            failed=1
          fi
          if [[ "${{ needs.build_and_coverage_hydration.result }}" != "success" ]]; then
            echo "::error::build_and_coverage_hydration failed with status: ${{ needs.build_and_coverage_hydration.result }}"
            failed=1
          fi
          if [[ "${{ needs.build_and_coverage_coverage.result }}" != "success" ]]; then
            echo "::error::build_and_coverage_coverage failed with status: ${{ needs.build_and_coverage_coverage.result }}"
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

  # Needs dist/ (the tarball's `files` list includes it) but not the Chromium test suite or the
  # docs build -- independent of build-and-coverage other than both running `pnpm build`.
  # release-qualification: required
  packed-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify published tarball contents
        run: |
          set -euo pipefail
          out="$(pnpm --filter @aceshooting/lyra-ui pack --dry-run 2>&1)"
          echo "$out"
          missing=0
          for f in dist/ssr-loader.js custom-elements.json llms.txt llms-full.txt llms/index.md llms/shared.md llms/tokens.md llms/peers.md llms/migration.md llms/components/lr-table.md; do
            if ! grep -qF "$f" <<< "$out"; then
              echo "::error::tarball is missing expected file: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::one or more expected files missing from the published tarball -- check files/exports/sideEffects in packages/lyra-ui/package.json"
            exit 1
          fi
      # Includes a single-component (<lr-button>) gzip-size canary, gated far tighter than the
      # core-bundle budget, to catch a PR that silently drags something heavy into the eager
      # import graph -- see bundleEntries.button in scripts/check-packed-consumer.mjs.
      - run: pnpm check:packed-consumer

      # Hard tarball budgets (packed/unpacked bytes and file count). Runs here rather than in
      # contract-policy because it shells out to `npm pack --dry-run`, which needs a built dist/.
      - run: pnpm --filter @aceshooting/lyra-ui check:package-size
      # Downloads the latest published package into an isolated temporary directory and compares
      # its normalized CEM/exports/declarations with this built tree. The pure parser/semver tests
      # run in static-checks; this is the networked release gate.
      - run: pnpm --filter @aceshooting/lyra-ui check:public-api

  # Builds storybook-static/ exactly once and shares it via artifact with every downstream
  # consumer (docs-and-storybook's own checks below, all 3 visual-regression shards) instead of
  # each rebuilding it independently from source -- the same "build once, fan out" pattern
  # build_and_coverage_build/dist already uses. CODECOV_TOKEN lives here since this is now the
  # only docs:build invocation in the whole workflow, so the bundle-analysis upload fires exactly
  # once by construction (no more need to deliberately omit the token from a second call site).
  docs_build:
    name: docs-and-storybook / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs:build only needs the already-committed custom-elements.json (via manifest:check), not
      # dist/ -- independent of build-and-coverage/packed-consumer.
      - run: pnpm docs:build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - run: git diff --exit-code -- .storybook/sitemap.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 1

  # release-qualification: required
  docs-and-storybook:
    runs-on: ubuntu-latest
    needs: docs_build
    # docs:check-show-code drives a full Playwright sweep clicking every "Show code" control
    # across the entire Storybook -- observed real-world duration varies 10.5-15+ minutes run to
    # run. The original 15 got this wrong (added without empirically checking worst-case
    # duration first) and force-cancelled a genuinely still-running job; 30 gives real headroom
    # over the observed variance while still catching a truly hung job well under the 360m default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # install-deps (apt) isn't covered by the cache above -- every job runs on a fresh VM --
      # so it always runs; only the ~100MB+ browser binary download is skippable on a cache hit.
      - run: pnpm --filter @aceshooting/lyra-ui exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static
      - run: pnpm docs:check
      - run: pnpm storybook:check
      # Clicks every `Show code` control across every `type: "docs"` entry in the built Storybook
      # and fails on navigation/click/unexpanded-control regressions, console errors, page errors,
      # or failed requests. It used to run only at release time (driven by hand from the /publish
      # flow), so a broken `Show code` could sit on main until someone cut a release.
      - run: pnpm docs:check-show-code

  # Blocking as of the 2026-07-20 font-substitution determinism fix (see
  # packages/lyra-ui/visual-baselines/README.md): the manifest's 83 stories now produce 253
  # live light/dark/RTL plus applicable forced-colors/narrow captures. Pending human review leaves
  # 207 compared with retained baselines and 46 as explicit ephemeral semantic/pixel evidence; all
  # capture or console errors remain blocking. The axis-level capture inventory is sorted and
  # round-robin partitioned into three deterministic shards (85/84/84 captures) so the historical
  # ~3.5min browser sweep no longer sits on one runner's critical path.
  visual-regression:
    name: visual-regression / shard ${{ matrix.shard }}/3
    needs: docs_build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VISUAL_SHARD_INDEX: ${{ matrix.shard }}
      VISUAL_SHARD_TOTAL: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # install-deps (apt) isn't covered by the cache above -- every job runs on a fresh VM --
      # so it always runs; only the ~100MB+ browser binary download is skippable on a cache hit.
      - run: pnpm --filter @aceshooting/lyra-ui exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static
      - name: Visual regression
        run: pnpm --filter @aceshooting/lyra-ui test:visual
      - name: Upload visual regression diff artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diff-${{ matrix.shard }}-of-3
          path: packages/lyra-ui/.visual-diff-output
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

  # Keep one stable required-check name for branch protection and release qualification while the
  # expensive work fans out above. `always()` makes a failed/cancelled matrix leg an explicit red
  # aggregate instead of skipping this job.
  # release-qualification: required
  visual-regression-gate:
    name: visual-regression
    if: ${{ always() }}
    needs: visual-regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all visual-regression shards
        env:
          VISUAL_REGRESSION_RESULT: ${{ needs.visual-regression.result }}
        run: |
          if [[ "$VISUAL_REGRESSION_RESULT" != "success" ]]; then
            echo "Visual-regression matrix concluded: $VISUAL_REGRESSION_RESULT" >&2
            exit 1
          fi

  # release-qualification: matrix
  platform-contracts:
    name: ${{ matrix.browser }} / Node ${{ matrix.node-version }} / shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    strategy:
      fail-fast: false
      # 11 legs total (down from 20 -- see docs/agents/ci-and-gates.md). Measured per-leg wall
      # time on the prior 20-leg matrix showed most Node 22 shards spending roughly half their
      # ~50-110s runtime on fixed per-job overhead (checkout/install/browser setup) rather than
      # test execution, since the 26-file test:platform suite was split too finely. Halving
      # chromium/firefox and collapsing chrome/edge/safari-Node22 to one shard each keeps every
      # leg's worst case comfortably under the workflow's other long poles while cutting total
      # billed runner-minutes; max-parallel no longer needs to chase the 20-runner cap.
      max-parallel: 11
      matrix:
        include:
          - browser: firefox
            node-version: 20
            shard_index: 1
            shard_total: 1
            install_browser: firefox
          - browser: chromium
            node-version: 22
            shard_index: 1
            shard_total: 2
            install_browser: chromium
          - browser: chromium
            node-version: 22
            shard_index: 2
            shard_total: 2
            install_browser: chromium
          - browser: chrome
            node-version: 22
            shard_index: 1
            shard_total: 1
            install_browser: chrome
          - browser: edge
            node-version: 22
            shard_index: 1
            shard_total: 1
            install_browser: msedge
          - browser: firefox
            node-version: 22
            shard_index: 1
            shard_total: 4
            install_browser: firefox
          - browser: firefox
            node-version: 22
            shard_index: 2
            shard_total: 4
            install_browser: firefox
          - browser: firefox
            node-version: 22
            shard_index: 3
            shard_total: 4
            install_browser: firefox
          - browser: firefox
            node-version: 22
            shard_index: 4
            shard_total: 4
            install_browser: firefox
          - browser: safari
            node-version: 20
            shard_index: 1
            shard_total: 1
            install_browser: webkit
          - browser: safari
            node-version: 22
            shard_index: 1
            shard_total: 1
            install_browser: webkit
    runs-on: ubuntu-latest
    # Every leg installs OS-level Playwright dependencies on a fresh VM before the cached browser
    # or test shard can run. A degraded apt mirror consumed 14m48s in Firefox shard 2/4 and the
    # former 15-minute ceiling cancelled the job before its first test. Keep hang detection while
    # budgeting the observed setup path, as the coverage and docs lanes already do.
    timeout-minutes: 30
    env:
      # packageManager pins pnpm 11, which requires Node >=22.13 and crashes
      # (imports node:sqlite) under Node 20. The Node 20 leg below installs a
      # compatible pnpm 10 instead, but pnpm has its own Corepack-like
      # "manage package manager versions" self-enforcement: any pnpm binary
      # run from this repo root notices the packageManager mismatch and
      # silently re-execs itself as the packageManager-pinned pnpm 11,
      # reintroducing the crash. This config disables that self-management,
      # but it only covers simple invocations -- `pnpm -r`/`pnpm pack`
      # (workspace-graph-resolving commands, used by `pnpm build` and by
      # check:packed-consumer's internal `pnpm pack`) re-exec into pnpm 11
      # and crash regardless of this setting. Kept as defense in depth
      # (harmless on the Node 22 leg); the step below removes the mismatch
      # itself, which is what actually protects those commands.
      npm_config_manage_package_manager_versions: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm/action-setup hard-errors if `version` is given and differs
          # from packageManager, so point it at an alternate file with a
          # Node-20-compatible pnpm version for that leg instead of
          # overriding `version` directly.
          package_json_file: ${{ matrix.node-version == 20 && '.github/ci-pnpm10.json' || 'package.json' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Match packageManager to the installed Node-20-compatible pnpm
        if: ${{ matrix.node-version == 20 }}
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.packageManager = JSON.parse(fs.readFileSync('.github/ci-pnpm10.json', 'utf8')).packageManager;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.install_browser }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @aceshooting/lyra-ui exec playwright install-deps ${{ matrix.install_browser }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install ${{ matrix.install_browser }}
      - name: Run platform contract suite
        env:
          WTR_BROWSER: ${{ matrix.browser }}
          WTR_TEST_SUITE: platform
          WTR_SHARD_INDEX: ${{ matrix.shard_index }}
          WTR_SHARD_TOTAL: ${{ matrix.shard_total }}
          WTR_STRICT_CONSOLE: "1"
        run: pnpm --filter @aceshooting/lyra-ui test:platform-shard
      # The package supports Node 20. Exercise the real tarball/install/import/type/style bundle
      # matrix once at that floor; the dedicated packed-consumer job covers Node 22.
      - name: Run packed consumer at the supported Node floor
        if: ${{ matrix.browser == 'firefox' && matrix.node-version == 20 && matrix.shard_index == 1 }}
        run: pnpm build && pnpm check:packed-consumer
