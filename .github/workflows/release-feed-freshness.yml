# Publication schedules this read-only check with its verified release tag. Manual version
# checks remain available when recovering an older release that predates the dispatcher.
name: Release feed freshness

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version the feed must report, e.g. 18.3.0'
        required: false
        type: string
      published_tag:
        description: Verified stable UI or flags tag from successful publication
        required: false
        type: string

permissions:
  contents: read

jobs:
  feed-matches-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Wait for the published upgrade feed to match npm
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISHED_TAG: ${{ inputs.published_tag }}
        run: |
          set -euo pipefail
          # Registry metadata can lag a successful publish. Bind UI checks to the triggering
          # tag; flags have a separate version and keep checking the current UI feed.
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "::error::Unsupported freshness trigger."
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && -n "$PUBLISHED_TAG" ]]; then
            echo "::error::Specify exactly one version or published tag."
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="$REQUESTED_VERSION"
          elif [[ "$PUBLISHED_TAG" =~ ^lyra-ui@((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$PUBLISHED_TAG" =~ ^lyra-flags@(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            VERSION="$(npm view @aceshooting/lyra-ui dist-tags.latest)"
          else
            echo "::error::Expected a supported UI or flags release tag."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable UI version."
            exit 1
          fi
          echo "::notice::Waiting for the upgrade feed to report @aceshooting/lyra-ui@${VERSION}."
          echo "If this job is waiting, deploy the sibling lyra-ui.com site now."
          if ! node scripts/release-integrity.mjs verify-site-freshness \
            --package @aceshooting/lyra-ui \
            --version "$VERSION" \
            --timeout-seconds 1800 \
            --poll-seconds 30; then
            echo "::error::RELEASE INCOMPLETE -- expected ${VERSION}; npm or the published feed is not current. Deploy ../lyra-ui.com, then re-run this job."
            exit 1
          fi
          echo "::notice::npm, changelog.json and the component catalog all report ${VERSION}."
