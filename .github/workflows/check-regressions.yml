name: Hosted regression discrimination

on:
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: Full 40-character commit containing the original source
        required: true
        type: string
      source_paths:
        description: JSON array of colocated .class.ts source paths
        required: true
        type: string
      test_paths:
        description: JSON array of matching colocated .test.ts paths
        required: true
        type: string
      grep:
        description: Mocha grep regular expression selecting only the regression cases
        required: true
        type: string
      expected_test_count:
        description: Exact number of selected tests; a positive integer
        required: true
        type: string

permissions:
  contents: read

jobs:
  discriminate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check the regression toolchain
        run: |
          node scripts/check-node-version.mjs
          test "pnpm@$(pnpm --version)" = "$(node -p "require('./package.json').packageManager")"

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium and its system dependencies
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install --with-deps chromium

      - name: Prove the selected tests discriminate the original source
        env:
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          SOURCE_PATHS: ${{ inputs.source_paths }}
          TEST_PATHS: ${{ inputs.test_paths }}
          MOCHA_GREP: ${{ inputs.grep }}
          EXPECTED_TEST_COUNT: ${{ inputs.expected_test_count }}
          HOSTED_REGRESSION_OUTPUT: ${{ runner.temp }}/hosted-regressions
        run: node scripts/check-hosted-regressions.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hosted-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-regressions
          if-no-files-found: warn
          retention-days: 14
