name: Scorecard supply-chain security

on:
  # Re-scores when branch protection settings change. Full scoring for this check needs a
  # `repo_token` (a PAT with repo-admin read) since the default GITHUB_TOKEN can't read branch
  # protection on a public repo -- see https://github.com/ossf/scorecard-action#authentication-with-fine-grained-pat-optional.
  # Uncommented, the check just scores lower until one is added.
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to upload results to the code-scanning dashboard.
      security-events: write
      # Needed by publish_results below (Sigstore keyless signing).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF API so the README badge renders a real score.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
