name: Full browser-engine suite

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # release-qualification: matrix
  full-engine:
    name: ${{ matrix.browser }} / shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # The official Playwright image ships every OS-level browser dependency AND the matching
    # browser binaries, so this job runs no apt transaction and downloads no browser. Both were
    # chronic stalls: a degraded Ubuntu mirror repeatedly wedged `playwright install-deps` for
    # 10-20 minutes with no error and no give-up, because apt sets no default Acquire::Retries
    # and its per-request timeout only fires on a fully idle socket -- a mirror trickling bytes
    # resets it forever. Raising timeouts (three times, in this file and ci.yml) treated the
    # symptom; removing apt from the job removes the failure mode.
    # The tag MUST match the `playwright` devDependency -- release-integrity asserts it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Docker defaults /dev/shm to 64MB. Chromium keeps its tile/compositor buffers
      # there, and this repo has already been bitten once by exhausting it (see the
      # --disable-dev-shm-usage note in web-test-runner.config.js): the renderer dies with
      # no CDP error, so it surfaces as an unrelated-looking timeout rather than an OOM.
      options: --shm-size=2g -v /usr/share/fonts:/usr/share/host-fonts:ro
    env:
      # The image runs as root but GitHub mounts HOME=/github/home, owned by the image's pwuser.
      # Firefox refuses to launch when $HOME is not owned by the current user ("Running Nightly
      # as root in a regular user's session is not supported"); Chromium and WebKit do not care,
      # so this surfaces as a Firefox-only failure. /root is root-owned, and staying constant for
      # the whole job keeps the pnpm store and setup-node cache on one path.
      HOME: /root
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # 8 shards per engine (was 4). Unlike ci.yml's platform-contracts matrix -- where finer
      # sharding lost to fixed per-job overhead because test:platform is only 26 files -- this
      # workflow runs the COMPLETE suite (~490 files). The deterministic cost-aware partition gives
      # the unusually expensive package-entrypoint graph fewer companions and leaves ordinary files
      # close to ~68 per leg, so checkout/install/browser setup remains a small fraction while the
      # graph import no longer dominates one shard. Shards run in parallel, so wall time is one
      # shard, not the sum.
      #
      # Deliberately more shards rather than more concurrency inside each shard: raising a lane's
      # WTR_CONCURRENCY was measured to break lr-span-waterfall's and lr-test-results' hover
      # assertions, which pass again at the tuned value. Pointer and paint timing degrades under
      # CPU contention, so every wtr process must keep CI's per-process shape.
      #
      # scripts/test.sh mirrors this via TEST_SH_ENGINE_SHARDS, so a failing shard here reproduces
      # locally as the identically-numbered shard.
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Match the runner's default font resolution
        run: |
          cat > /etc/fonts/local.conf <<'CONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig><dir>/usr/share/host-fonts</dir></fontconfig>
          CONF
          fc-cache -f >/dev/null 2>&1 || true
          resolved="$(fc-match sans-serif)"
          echo "sans-serif -> $resolved"
          case "$resolved" in
            *DejaVu*) ;;
            *) echo "::error::sans-serif resolved to '$resolved', not DejaVu -- text-metric tests would measure the wrong typeface"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # package-entrypoints.test.ts imports dist package targets, so every
      # shard needs the same build-first contract as the primary CI suite.
      - run: pnpm build
      - name: Run complete non-coverage test shard
        env:
          WTR_BROWSER: ${{ matrix.browser }}
          WTR_STRICT_CONSOLE: '1'
          WTR_COVERAGE: '0'
          WTR_SHARD_INDEX: ${{ matrix.shard }}
          WTR_SHARD_TOTAL: '8'
        run: pnpm --filter @aceshooting/lyra-ui test:full-engine-shard
