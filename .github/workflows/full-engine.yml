name: Full browser-engine suite

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-engine:
    name: ${{ matrix.browser }} / shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same cache key scheme ci.yml's platform-contracts job already populates for these exact
      # browsers -- GitHub Actions cache is repo-scoped, not workflow-scoped, so this reuses
      # entries ci.yml wrote instead of downloading the ~100MB+ browser binary from scratch here.
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # install-deps (apt) isn't covered by the cache above -- every job runs on a fresh VM --
      # so it always runs; only the ~100MB+ browser binary download is skippable on a cache hit.
      - run: pnpm --filter @aceshooting/lyra-ui exec playwright install-deps ${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aceshooting/lyra-ui exec playwright install ${{ matrix.browser }}
      # package-entrypoints.test.ts imports dist package targets, so every
      # shard needs the same build-first contract as the primary CI suite.
      - run: pnpm build
      - name: Run complete non-coverage test shard
        env:
          WTR_BROWSER: ${{ matrix.browser }}
          WTR_STRICT_CONSOLE: '1'
          WTR_COVERAGE: '0'
          WTR_SHARD_INDEX: ${{ matrix.shard }}
          WTR_SHARD_TOTAL: '4'
        run: pnpm --filter @aceshooting/lyra-ui test:full-engine-shard
