name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)publish, e.g. lyra-ui@3.7.1'
        required: true
        type: string
      dry_run:
        description: 'Validate and dry-run the existing release tarball instead of publishing it'
        required: false
        type: boolean
        default: false
      first_package_bootstrap:
        description: 'Use the protected npm token for the first publication of lyra-docs, lyra-ide, lyra-translations, lyra-map or lyra-3d only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Credential-free source/test/rebuild verification is shared with recovery signing.
  verify:
    uses: ./.github/workflows/release-verification.yml
    permissions:
      actions: read
      checks: read
      contents: read
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      trigger_event: ${{ github.event_name }}
      workflow_ref: ${{ github.ref }}
      workflow_sha: ${{ github.sha }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download byte-verified tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-tarball
          path: ${{ runner.temp }}/verified-release

      - name: Verify transferred artifact digest
        id: release_asset
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          tarballs=()
          while IFS= read -r -d '' file; do
            tarballs+=("$file")
          done < <(find "$RUNNER_TEMP/verified-release" -maxdepth 1 -type f -name '*.tgz' -print0)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one verified tarball, found ${#tarballs[@]}."
            exit 1
          fi
          actual_sha256="$(sha256sum "${tarballs[0]}" | cut -d ' ' -f1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Transferred tarball digest does not match the read-only verification job."
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      # Environment approval can outlive the read-only job. Rebind both mutable GitHub surfaces
      # to its outputs before attesting: the annotated tag must still peel to the verified commit,
      # and the release must serve exactly the verified tarball bytes.
      - name: Download verified standalone assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-additional-release-assets
          path: ${{ runner.temp }}/verified-additional-release

      - name: Verify standalone asset transfer
        id: additional_assets
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.additional_assets_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified-additional-release"
          test -f SHA256SUMS && test ! -L SHA256SUMS
          test "$(sha256sum SHA256SUMS | cut -d ' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          count=0
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^[a-f0-9]{64}'  '[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo '::error::Invalid standalone asset manifest entry.'
              exit 1
            fi
            file="${line:66}"
            test "$file" != SHA256SUMS && test -f "$file" && test ! -L "$file"
            count=$((count + 1))
          done < SHA256SUMS
          test "$count" -ge 2
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq "$((count + 1))"
          sha256sum --check --strict SHA256SUMS
          {
            echo 'paths<<RELEASE_ASSETS'
            while IFS= read -r line; do printf '%s/%s\n' "$PWD" "${line:66}"; done < SHA256SUMS
            echo 'RELEASE_ASSETS'
          } >> "$GITHUB_OUTPUT"

      - name: Rebind release tag and tarball after approval
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
          EXPECTED_TAG_SHA: ${{ needs.verify.outputs.tag_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARBALL: ${{ steps.release_asset.outputs.path }}
        run: |
          set -euo pipefail
          canonical="https://github.com/$GITHUB_REPOSITORY.git"
          remote_sha="$(git ls-remote --tags "$canonical" "refs/tags/$TAG^{}" | cut -f1)"
          if [[ "$remote_sha" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::Release tag moved after read-only verification."
            exit 1
          fi
          if [[ ! ( "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ) ]]; then
            gh release upload "$TAG" "$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          roundtrip="$RUNNER_TEMP/release-roundtrip"
          mkdir -p "$roundtrip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir "$roundtrip"
          assets=()
          while IFS= read -r -d '' file; do assets+=("$file"); done \
            < <(find "$roundtrip" -maxdepth 1 -type f -name '*.tgz' -print0)
          if [[ "${#assets[@]}" -ne 1 || "$(sha256sum "${assets[0]}" | cut -d ' ' -f1)" != "$EXPECTED_SHA256" ]]; then
            echo "::error::GitHub Release does not serve exactly the verified tarball."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.verify.outputs.node_version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm CLI (trusted publishing needs >=11.5.1)
        run: |
          set -euo pipefail
          NPM_VERSION=12.0.1
          # npm's own registry integrity hash (sha512), not just an exact version pin --
          # verified against the published tarball before install rather than trusting
          # registry+TLS alone.
          NPM_TARBALL_INTEGRITY='sha512-L5T9i/YAQWQWqTS/xZxJkei/9zcu99hCeE4qi41IyBVV7mRQad3qc2JfuOktwmH+qwGI/V2rbCL+/UYxb1+RQA=='
          curl -fsSL -o npm.tgz "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          actual_integrity="sha512-$(openssl dgst -sha512 -binary npm.tgz | base64 -w0)"
          if [[ "$actual_integrity" != "$NPM_TARBALL_INTEGRITY" ]]; then
            echo "::error::npm@${NPM_VERSION} tarball integrity mismatch: expected $NPM_TARBALL_INTEGRITY, got $actual_integrity"
            exit 1
          fi
          # Use the verified distribution's bundled dependencies without a global install.
          npm_cli_dir="$(mktemp -d "$RUNNER_TEMP/npm-cli.XXXXXX")"
          tar --extract --gzip --file npm.tgz --directory "$npm_cli_dir" --strip-components=1
          rm -f npm.tgz
          actual_version="$(node "$npm_cli_dir/bin/npm-cli.js" --version)"
          test "$actual_version" = "$NPM_VERSION"
          npm_bin_dir="$npm_cli_dir/runner-bin"
          mkdir -p "$npm_bin_dir"
          ln -s "$npm_cli_dir/bin/npm-cli.js" "$npm_bin_dir/npm"
          echo "$npm_bin_dir" >> "$GITHUB_PATH"

      - name: Require an unpublished first-publication package for bootstrap after approval
        env:
          BOOTSTRAP: ${{ inputs.first_package_bootstrap }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$BOOTSTRAP" != true ]]; then exit 0; fi
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$DRY_RUN" == true ||
                ! "$TAG" =~ ^lyra-(docs|ide|translations|map|3d)@(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::First-package bootstrap requires a real, manually dispatched stable lyra-docs, lyra-ide, lyra-translations, lyra-map or lyra-3d release.'
            exit 1
          fi
          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/%40aceshooting%2F${TAG%@*}")"
          if [[ "$status" != 404 ]]; then
            echo "::error::Expected npm registry absence (HTTP 404) before ${TAG%@*} bootstrap; received HTTP $status."
            exit 1
          fi

      - name: Rebind all standalone release assets after approval
        env:
          EXPECTED_TAG_SHA: ${{ needs.verify.outputs.tag_sha }}
          EXPECTED_TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARBALL: ${{ steps.release_asset.outputs.path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_TAG_SHA"
          dir="$RUNNER_TEMP/verified-additional-release"
          payloads=()
          while IFS= read -r line; do payloads+=("$dir/${line:66}"); done < "$dir/SHA256SUMS"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$DRY_RUN" != true ]]; then
            gh release upload "$TAG" "${payloads[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          roundtrip="$RUNNER_TEMP/all-release-roundtrip"
          mkdir -p "$roundtrip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --dir "$roundtrip"
          allowed=()
          for file in "$TARBALL" "${payloads[@]}"; do
            name="${file##*/}"
            allowed+=("$name" "$name.sigstore.json" "$name.intoto.jsonl")
          done
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            known=false
            for allowed_name in "${allowed[@]}"; do
              if [[ "$name" == "$allowed_name" ]]; then known=true; break; fi
            done
            if [[ ! -f "$file" || -L "$file" || "$known" != true ]]; then
              echo '::error::Unexpected release asset after approval.'
              exit 1
            fi
          done < <(find "$roundtrip" -mindepth 1 -maxdepth 1 -print0)
          (cd "$roundtrip" && sha256sum --check --strict "$dir/SHA256SUMS")
          test "$(sha256sum "$roundtrip/${TARBALL##*/}" | cut -d ' ' -f1)" = "$EXPECTED_TARBALL_SHA256"

      - name: Generate release provenance
        id: attest
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release_asset.outputs.path }}

      # actions/attest writes one compact Sigstore bundle per line, so the same bytes are also valid
      # JSON Lines. `.intoto.jsonl` is the suffix provenance scanners discover; `.sigstore.json`
      # stays for Sigstore tooling.
      - name: Upload provenance to GitHub release
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARBALL: ${{ steps.release_asset.outputs.path }}
        run: |
          provenance="$TARBALL.sigstore.json"
          intoto="$TARBALL.intoto.jsonl"
          cp "$BUNDLE" "$provenance"
          cp "$BUNDLE" "$intoto"
          gh release upload "$TAG" "$provenance" "$intoto" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Generate standalone release provenance
        id: attest_additional
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.additional_assets.outputs.paths }}

      - name: Upload standalone release provenance
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        env:
          BUNDLE: ${{ steps.attest_additional.outputs.bundle-path }}
          EXPECTED_TAG_SHA: ${{ needs.verify.outputs.tag_sha }}
          EXPECTED_TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
          TARBALL: ${{ steps.release_asset.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_TAG_SHA"
          dir="$RUNNER_TEMP/verified-additional-release"
          payloads=()
          while IFS= read -r line; do payloads+=("$dir/${line:66}"); done < "$dir/SHA256SUMS"
          roundtrip="$RUNNER_TEMP/standalone-final-roundtrip"
          mkdir -p "$roundtrip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --dir "$roundtrip"
          allowed=()
          for file in "$TARBALL" "${payloads[@]}"; do
            name="${file##*/}"
            allowed+=("$name" "$name.sigstore.json" "$name.intoto.jsonl")
          done
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            known=false
            for allowed_name in "${allowed[@]}"; do
              if [[ "$name" == "$allowed_name" ]]; then known=true; break; fi
            done
            if [[ ! -f "$file" || -L "$file" || "$known" != true ]]; then
              echo '::error::Unexpected release asset before provenance upload.'
              exit 1
            fi
          done < <(find "$roundtrip" -mindepth 1 -maxdepth 1 -print0)
          (cd "$roundtrip" && sha256sum --check --strict "$dir/SHA256SUMS")
          test "$(sha256sum "$roundtrip/${TARBALL##*/}" | cut -d ' ' -f1)" = "$EXPECTED_TARBALL_SHA256"
          remote_sha="$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_TAG_SHA"
          bundles=()
          while IFS= read -r line; do
            name="${line:66}"
            cp "$BUNDLE" "$dir/$name.sigstore.json"
            cp "$BUNDLE" "$dir/$name.intoto.jsonl"
            bundles+=("$dir/$name.sigstore.json" "$dir/$name.intoto.jsonl")
          done < "$dir/SHA256SUMS"
          gh release upload "$TAG" "${bundles[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to npm
        if: ${{ inputs.first_package_bootstrap != true }}
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
          EXPECTED_TAG_SHA: ${{ needs.verify.outputs.tag_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARBALL: ${{ steps.release_asset.outputs.path }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" | cut -f1)"
          if [[ "$remote_sha" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::Release tag moved before npm publish."
            exit 1
          fi
          final_asset="$RUNNER_TEMP/final-release-asset"
          mkdir -p "$final_asset"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir "$final_asset"
          assets=()
          while IFS= read -r -d '' file; do assets+=("$file"); done \
            < <(find "$final_asset" -maxdepth 1 -type f -name '*.tgz' -print0)
          if [[ "${#assets[@]}" -ne 1 || "$(sha256sum "${assets[0]}" | cut -d ' ' -f1)" != "$EXPECTED_SHA256" ]]; then
            echo "::error::GitHub Release tarball changed before npm publish."
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            npm publish "$TARBALL" --access public --dry-run
          else
            npm publish "$TARBALL" --access public
          fi

      - name: Bootstrap first package publication with npm provenance
        if: ${{ inputs.first_package_bootstrap == true }}
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
          EXPECTED_TAG_SHA: ${{ needs.verify.outputs.tag_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARBALL: ${{ steps.release_asset.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo '::error::NPM_BOOTSTRAP_TOKEN is required in the protected npm-publish environment.'
            exit 1
          fi
          remote_sha="$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" | cut -f1)"
          if [[ "$remote_sha" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::Release tag moved before npm bootstrap."
            exit 1
          fi
          final_asset="$RUNNER_TEMP/final-release-asset"
          mkdir -p "$final_asset"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir "$final_asset"
          assets=()
          while IFS= read -r -d '' file; do assets+=("$file"); done \
            < <(find "$final_asset" -maxdepth 1 -type f -name '*.tgz' -print0)
          if [[ "${#assets[@]}" -ne 1 || "$(sha256sum "${assets[0]}" | cut -d ' ' -f1)" != "$EXPECTED_SHA256" ]]; then
            echo "::error::GitHub Release tarball changed before npm bootstrap."
            exit 1
          fi
          status="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/%40aceshooting%2F${TAG%@*}")"
          if [[ "$status" != 404 ]]; then
            echo "::error::Expected npm registry absence (HTTP 404) before ${TAG%@*} bootstrap; received HTTP $status."
            exit 1
          fi
          npm publish "$TARBALL" --access public --provenance

      # `npm publish` also succeeds when npm only stages the version (a trusted publisher without
      # "Allow npm publish" needs a 2FA promotion), so require the registry to serve these bytes.
      - name: Confirm the registry serves the published tarball
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          TARBALL: ${{ steps.release_asset.outputs.path }}
        run: |
          set -euo pipefail
          package="${TAG%@*}"
          version="${TAG##*@}"
          expected="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          url="https://registry.npmjs.org/%40aceshooting%2F${package}/${version}"
          metadata="$RUNNER_TEMP/npm-published-version.json"
          for _ in $(seq 1 40); do
            curl --silent --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 "$url" > "$metadata"
            integrity="$(node -e 'const fs=require("node:fs");try{console.log(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).dist?.integrity??"")}catch{console.log("")}' "$metadata")"
            if [[ "$integrity" == "$expected" ]]; then
              echo "npm serves @aceshooting/${package}@${version} with the released integrity."
              exit 0
            fi
            if [[ -n "$integrity" ]]; then
              echo "::error::npm serves @aceshooting/${package}@${version} with integrity ${integrity}, not the released ${expected}."
              exit 1
            fi
            sleep 30
          done
          echo "::error::@aceshooting/${package}@${version} is still not served by the npm registry 20 minutes after publish. It is most likely staged: promote it on npmjs.com, and tick \"Allow npm publish\" on the package's trusted publisher (or add a missing one) for future releases."
          exit 1

  dispatch-freshness:
    needs: [verify, publish]
    if: ${{ needs.publish.result == 'success' && (github.event_name == 'release' || inputs.dry_run != true) && (startsWith(needs.verify.outputs.tag, 'lyra-ui@') || startsWith(needs.verify.outputs.tag, 'lyra-flags@')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Schedule the published upgrade feed check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISHED_TAG" =~ ^lyra-(ui|flags)@(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a verified stable UI or flags release tag."
            exit 1
          fi
          gh workflow run release-feed-freshness.yml --repo "$GITHUB_REPOSITORY" --ref main -f published_tag="$PUBLISHED_TAG"
