packages:
  - 'packages/*'
# lyra-ui and lyra-translations peer on each other (the loader imports the catalogs; the catalogs register
# through lyra-ui). Neither build needs the other's install, and lyra-translations assembles from lyra-ui's dist.
ignoreWorkspaceCycles: true
patchedDependencies:
  '@codecov/bundler-plugin-core@2.0.1': patches/@codecov__bundler-plugin-core@2.0.1.patch
  '@web/test-runner-coverage-v8@1.0.0': patches/@web__test-runner-coverage-v8@1.0.0.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  sprintf-js@1.0.3: patches/sprintf-js@1.0.3.patch
# dependency-cruiser parses TypeScript through the legacy compiler API, which typescript@7 no longer
# exports (its range is >=2 <7). Give it a private typescript@6 instead of the hoisted workspace copy;
# lyra-ui and every other package keep typescript@7. Drop this when dependency-cruiser supports 7.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: npm:typescript@6.0.3
  # The Lit template plugins run on oxlint's own parser and never load ESLint, so their eslint peer
  # is optional (otherwise pnpm installs eslint and about 80 packages for nothing).
  eslint-plugin-lit:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-wc:
    peerDependenciesMeta:
      eslint:
        optional: true
# `pnpm install` warns about deprecated dependencies. The dev-only chain
# @lit-labs/ssr > node-fetch@3 > fetch-blob@3 requires node-domexception@^1.0.0.
# node-domexception@2 is also deprecated, and fetch-blob@4 still requests ^1.0.0;
# keep the compatible 1.0.0 exception until the upstream chain uses native DOMException.
allowedDeprecatedVersions:
  node-domexception: 1.0.0
# `pnpm peers check` (run by `pnpm check:lockfile`) must stay clean; these are its reviewed exceptions.
peerDependencyRules:
  allowedVersions:
    # The Storybook docs build runs this Codecov plugin on Vite 8, while its newest release (2.0.1)
    # still declares `4.x || 5.x || 6.x`.
    '@codecov/vite-plugin>vite': '8'
  allowAny:
    # lyra-ui's optional xlsx peer is `>=0.20.3 <0.21.0`. The only maintained 0.20 build is the
    # SheetJS CDN tarball, whose resolved version is a URL that pnpm cannot compare with a range.
    - xlsx
overrides:
  # Keep renderer-owned declaration sources aligned with the reviewed MapLibre source lock.
  'maplibre-gl@6.15.0>@maplibre/geojson-vt': 6.3.0
  'maplibre-gl@6.15.0>@maplibre/vt-pbf': 4.3.2
  # Codecov 2.0.1 uses Zod 3 schemas; its compatibility patch supports patched Zod 4.
  '@codecov/bundler-plugin-core@2.0.1>zod': 4.6.7
  # These AG-UI versions already import Zod v4; use its patched collection validators.
  '@ag-ui/client@1.0.3>zod': 4.6.7
  '@ag-ui/proto@1.0.3>zod': 4.6.7
  # Keep the reviewed DOCX engine dependency graph aligned with its source lock.
  '@docx-editor.dev/core@2.32.0>@docx-editor.dev/i18n': 2.32.0
  '@docx-editor.dev/core@2.32.0>prosemirror-view': 1.42.7
  'prosemirror-state@1.4.4>prosemirror-view': 1.42.7
  'prosemirror-commands@1.7.2>prosemirror-transform': 1.12.4
  'prosemirror-state@1.4.4>prosemirror-transform': 1.12.4
  'prosemirror-view@1.42.7>prosemirror-transform': 1.12.4
  '@xmldom/xmldom': ^0.8.15
  'epubjs@0.3.93>@types/localforage': '-'
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@<3.3.20': 3.3.20
  # typed-rest-client (Stryker) asks for a qs that has three published advisories.
  'qs@<6.16.0': 6.16.1
  'source-map-js@<1.2.2': 1.2.2
